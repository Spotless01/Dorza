<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Dorza</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Navigation -->
<nav class="nav-container">
  <a href="index.html" class="brand-name">Dorza</a>

  <ul class="nav-listing">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="request_door.html">Request a Quote</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>

  <div class="hamburger">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>
</nav>

<main>

<section class="contact-section">
  <div class="contact-container">

    <!-- LEFT -->
    <div class="contact-info animate">
      <h1>Contact Dorza</h1>
      <p>
        Send us a message and our team will respond to your inquiry within 24 hours
      </p>

      <div class="contact-details">
        <p>📍 Accra, Ghana</p>
        <p>📞 +233 554 341 075</p>
        <p>📞 +233 595 677 281</p>
        <p>📧 dorzagh@gmail.com</p>
      </div>
    </div>

    <!-- RIGHT (FORM) -->
    <div class="contact-form-card animate">
      <form id="contactForm">

        <div class="form-group">
          <input type="text" id="name" required>
          <label>Full Name</label>
        </div>

        <div class="form-group">
          <input type="tel" id="phone" required>
          <label>Phone Number</label>
        </div>

        <div class="form-group">
          <select id="subject" required>
            <option value="" disabled selected hidden></option>
            <option>General Enquiry</option>
            <option>Door Purchase</option>
            <option>Custom Door Request</option>
            <option>Pricing Request</option>
          </select>
          <label>Select Message Type</label>
        </div>

        <div class="form-group">
          <textarea id="message" rows="4"></textarea>
          <label>Message (Optional)</label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Send Message
        </button>

      </form>
    </div>

  </div>
</section>

</main>


<!-- FLOATING WHATSAPP BUTTON -->
<a
  href="https://wa.me/233551836194?text=Hello%20Dorza,%20I%20would%20like%20to%20make%20an%20enquiry."
  class="whatsapp-float"
  target="_blank"
>
  <img src="assets/images/whatsapp.png" alt="WhatsApp">
</a>

<script>
  const form = document.getElementById("contactForm");
  const btn = document.getElementById("submitBtn");

  // Your email
  const emailAddress = "dorzagh@gmail.com";

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    btn.innerText = "Sending your message...";
    btn.disabled = true;

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const subject = document.getElementById("subject").value;
    const message = document.getElementById("message").value;

    // Email content
    const body =
      `Hello Doorza,\n\n` +
      `Name: ${name}\n` +
      `Phone: ${phone}\n` +
      `Message Type: ${subject}\n` +
      `Message: ${message}`;

    // Open email client
    setTimeout(() => {

      window.location.href =
        `mailto:${emailAddress}?subject=Dorza Customer Enquiry&body=${encodeURIComponent(body)}`;

      btn.innerText = "Message Sent ✅";

      form.reset();

      setTimeout(() => {
        btn.innerText = "Send Message";
        btn.disabled = false;
      }, 2500);

    }, 1200);
  });

  // Hamburger
  const hamburger = document.querySelector(".hamburger");
  const navMenu = document.querySelector(".nav-listing");

  hamburger.addEventListener("click", () => {
    navMenu.classList.toggle("active");
    hamburger.classList.toggle("active");
  });
</script>


<script>
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show");
    }
  });
});

document.querySelectorAll(".animate").forEach(el => {
  observer.observe(el);
});
</script>

</body>
</html>
