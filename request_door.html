<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Navigation -->
<nav class="nav-container">
  <a href="index.html" class="brand-name">Dorza</a>

  <ul class="nav-listing">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="request_door.html">Make Door Request</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>

  <div class="hamburger">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>
</nav>

<main>
<section id="contact" class="contact-section">
  <div class="contact-container">
    <h2>Request a Quote</h2>

    <div class="google-form-wrapper">
      <iframe 
        src="https://docs.google.com/forms/d/e/1FAIpQLSdoCcd5XEkHSmuhOFMBy7AFuHsx1WQaSlcu81124kCTEkM52Q/viewform?embedded=true" width="390" height="1840" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>"
      </div>

  </div>
</section>

<!-- Success Popup -->
<div class="success-popup" id="successPopup">
  <div class="success-box">
    <p>
  Your message has been successfully sent.<br>
  Our team will contact you shortly.
</p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>
</main>

  <script>
    const whatsappNumber = "233551836194";
const emailAddress = "dorzagh@gmail.com";

const form = document.getElementById("contact-form");
const popup = document.getElementById("successPopup");
const submitBtn = document.querySelector(".submit-btn");

if (form) {
  form.addEventListener("submit", function(e) {
  e.preventDefault();

  submitBtn.textContent = "Sending your message...";
  submitBtn.disabled = true;

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const message = document.getElementById("message").value;

  const text =
    `Hello Doorza,%0A%0A` +
    `Name: ${name}%0A` +
    `Phone: ${phone}%0A` +
    `Note: ${message}`;

  // Open WhatsApp
  window.open(`https://wa.me/${whatsappNumber}?text=${text}`, "_blank");

  // Small delay for smoother UX
  setTimeout(() => {
    window.location.href =
      `mailto:${emailAddress}?subject=New Doorza Enquiry&body=${text}`;

    popup.style.display = "flex";

    form.reset();
    submitBtn.textContent = "Send Message";
    submitBtn.disabled = false;

  }, 1200);
});
}


function closePopup() {
  popup.style.display = "none";
}
</script>

<script>
  const hamburger = document.querySelector(".hamburger");
  const navMenu = document.querySelector(".nav-listing");

  hamburger.addEventListener("click", () => {
    navMenu.classList.toggle("active");
    hamburger.classList.toggle("active");
  });
</script>

</body>
</html>
