<body>

<!-- Navigation -->

    <span class="bar"></span>

<main>
<section class="request-section">

  <div class="request-container">

    <h1 class="request-title">Request a Custom Door</h1>
    <p class="request-subtitle">
      Fill the form below and our team will get back to you.
    </p>

    <div class="google-form-wrapper">
      <iframe 
        src="https://docs.google.com/forms/d/e/1FAIpQLSdoCcd5XEkHSmuhOFMBy7AFuHsx1WQaSlcu81124kCTEkM52Q/viewform?embedded=true"
        frameborder="0"
        marginheight="0"
        marginwidth="0">
        Loading…
      </iframe>
    </div>

  </div>

</section>
</main>

  <script>
    const whatsappNumber = "233551836194";
const emailAddress = "dorzagh@gmail.com";

const form = document.getElementById("contact-form");
const popup = document.getElementById("successPopup");
const submitBtn = document.querySelector(".submit-btn");

if (form) {
  form.addEventListener("submit", function(e) {
  e.preventDefault();

  submitBtn.textContent = "Sending your message...";
  submitBtn.disabled = true;

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const message = document.getElementById("message").value;

  const text =
    `Hello Doorza,%0A%0A` +
    `Name: ${name}%0A` +
    `Phone: ${phone}%0A` +
    `Note: ${message}`;

  // Open WhatsApp
  window.open(`https://wa.me/${whatsappNumber}?text=${text}`, "_blank");

  // Small delay for smoother UX
  setTimeout(() => {
    window.location.href =
      `mailto:${emailAddress}?subject=New Doorza Enquiry&body=${text}`;

    popup.style.display = "flex";

    form.reset();
    submitBtn.textContent = "Send Message";
    submitBtn.disabled = false;

  }, 1200);
});
}


function closePopup() {
  popup.style.display = "none";
}
</script>

<script>
  const hamburger = document.querySelector(".hamburger");
  const navMenu = document.querySelector(".nav-listing");

  // Toggle menu
  hamburger.addEventListener("click", (e) => {
    e.stopPropagation();

    navMenu.classList.toggle("active");
    hamburger.classList.toggle("active");
  });

  // Close when clicking nav links
  document.querySelectorAll(".nav-listing a").forEach(link => {
    link.addEventListener("click", () => {
      navMenu.classList.remove("active");
      hamburger.classList.remove("active");
    });
  });

  // Close when clicking anywhere outside
  document.addEventListener("click", (e) => {

    const clickedInsideMenu = navMenu.contains(e.target);
    const clickedHamburger = hamburger.contains(e.target);

    if (!clickedInsideMenu && !clickedHamburger) {
      navMenu.classList.remove("active");
      hamburger.classList.remove("active");
    }

  });
</script>
</body>
</html>
