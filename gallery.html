<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-------- Navigation Section -------->
<nav class="nav-container">
  <a href="index.html" class="brand-name">Dorza</a>

  <ul class="nav-listing">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="request_door.html">Make Door Request</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="contact.html">Contact Us</a></li>
  </ul>

  <div class="hamburger">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>
</nav>

<main>
  <section class="gallery-section">
    <h2 class="gallery-title">Our Doors Collection</h2>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>
</main>

<!-- Fullscreen Modal -->
<div class="image-modal" id="imageModal">
  <span class="close-btn" id="closeModal">&times;</span>
  <img id="modalImage" src="" alt="Door Full View">
</div>

  <footer>

  </footer>

<script>
  const doors = [
    {
      name: "Modern Wooden Door",
      image: "assets/images/door1.jpg"
    },
    {
      name: "Luxury Security Door",
      image: "assets/images/door2.jpg"
    },
    {
      name: "Classic Interior Door",
      image: "assets/images/door3.jpg"
    }
  ];

  const whatsappNumber = "233551836194"; // Replace with your number
  const galleryGrid = document.getElementById("galleryGrid");

  doors.forEach(door => {
    const card = document.createElement("div");
    card.classList.add("door-card");

    card.innerHTML = `
      <img src="${door.image}" alt="${door.name}" class="door-image" loading="lazy">
      <a 
        href="https://wa.me/${whatsappNumber}?text=Hello Doorza, I'm interested in the ${encodeURIComponent(door.name)}. Please provide price and availability."
        target="_blank"
        class="enquiry-btn"
      >
        Make Enquiry
      </a>
    `;

    galleryGrid.appendChild(card);
  });

  /* Modal Logic */
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");
  const closeModal = document.getElementById("closeModal");

  document.addEventListener("click", function(e) {
 if (e.target.classList.contains("door-image")) {
  modal.style.display = "flex";
  modalImg.src = e.target.src;
  document.body.style.overflow = "hidden";
}
  });

  closeModal.addEventListener("click", () => {
  modal.style.display = "none";
  document.body.style.overflow = "auto";
});

  modal.addEventListener("click", (e) => {
  if (e.target === modal) {
    modal.style.display = "none";
    document.body.style.overflow = "auto";
  }
});

  document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    modal.style.display = "none";
  }
});

  const hamburger = document.querySelector(".hamburger");
  const navMenu = document.querySelector(".nav-listing");

  hamburger.addEventListener("click", () => {
    navMenu.classList.toggle("active");
    hamburger.classList.toggle("active");
  });
</script>
</body>
</html>
